<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; max-width: 700px; margin: 40px auto; }
textarea { width: 100%; height: 120px; margin-bottom: 10px; }
#output { width: 100%; height: 60px; }

.list-item {
    background: #f7f7f7;
    padding: 8px 12px;
    margin: 6px 0;
    border-radius: 6px;
    border: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.copy-btn {
    padding: 4px 8px;
    background: #333;
    color: white;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    border: none;
    margin-left: 10px;
}

.copy-btn:hover {
    background: #000;
}
</style>
</head>
<body>

<h2>Order Details Cleaner</h2>

<textarea id="input" placeholder="Paste order details here..."></textarea>
<button onclick="cleanText()">Convert</button>

<h3>Output</h3>
<textarea id="output" readonly></textarea>
<br>
<button class="copy-btn" onclick="copyOutput()">Copy Output</button>

<h3>Saved Outputs</h3>
<div id="outputList"></div>

<script>
function cleanText() {
    let text = document.getElementById("input").value;

    let lines = text.split("\n").map(l => l.trim()).filter(l => l !== "");

    let firstLine = "";
    let secondLine = "";

    lines.forEach(line => {
        let parts = line.split(":");
        if (parts.length > 1) {
            let value = parts.slice(1).join(":").trim();

            if (line.toLowerCase().includes("leather") ||
                line.toLowerCase().includes("clasp") ||
                line.toLowerCase().includes("emboss")) {
                firstLine += (firstLine ? "  /  " : "") + value;
            } else {
                secondLine += (secondLine ? " " : "") + value;
            }
        }
    });

    let cleaned = firstLine + "\n" + secondLine;

    document.getElementById("output").value = cleaned;

    // Add to list with a copy button
    let list = document.getElementById("outputList");
    let div = document.createElement("div");
    div.className = "list-item";

    let textSpan = document.createElement("span");
    textSpan.textContent = cleaned;

    let copyButton = document.createElement("button");
    copyButton.className = "copy-btn";
    copyButton.textContent = "Copy";
    copyButton.onclick = function () {
        navigator.clipboard.writeText(cleaned);
    };

    div.appendChild(textSpan);
    div.appendChild(copyButton);
    list.appendChild(div);

    document.getElementById("input").value = "";
}

// Copy main output box
function copyOutput() {
    let text = document.getElementById("output").value;
    navigator.clipboard.writeText(text);
}
</script>

</body>
</html>
