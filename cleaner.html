<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GPS Coordinate Cleaner (DMS)</title>
<style>
  :root { --bg:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb; --accent:#111827; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
    background:var(--bg); color:var(--text); padding:24px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p  { color: var(--muted); margin: 0 0 16px; }
  .card {
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 24px;
  }
  label { display:block; font-weight:600; margin:10px 0 6px; }
  textarea, input[type="text"] {
    width:calc(100% - 12px);
    margin:0 auto;
    display:block;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
  }
  .row {
    display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;
  }
  button {
    padding:10px 14px; border:1px solid var(--accent);
    background:var(--accent); color:#fff;
    border-radius:10px; cursor:pointer; font-weight:600;
  }
  .ghost { background:transparent; color:var(--accent); }
  .out {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:16px;
  }
  .help { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .inline { display:flex; gap:6px; align-items:center; font-weight:400; }
  input[type="checkbox"] { width:16px; height:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GPS Coordinate Cleaner (DMS)</h1>
  <p>Paste coordinates in almost any DMS style — the script fixes symbols and spacing.</p>
  <div class="card">
    <label for="in">Input</label>
    <textarea id="in" rows="3" placeholder='e.g. 44* 59' 25.5" N 122* 43' 59.2" W'></textarea>

    <div class="row">
      <button id="fmt" type="button">Format</button>
      <button id="copy" class="ghost" type="button">Copy Output</button>
      <button id="clear" class="ghost" type="button">Clear</button>
      <label class="inline" style="margin-left:auto;">
        <input type="checkbox" id="addDots" />
        <span>Add centered dots (•)</span>
      </label>
    </div>

    <label for="out" style="margin-top:16px;">Output</label>
    <input id="out" class="out" type="text" placeholder="Formatted result appears here" readonly />
    <div class="help">
      Target format: <code>DD° MM' SS.S&quot; H  DD° MM' SS.S&quot; H</code> — dots optional
    </div>
  </div>
</div>

<script>
function normalizeSymbols(str) {
  return str
    // Normalize degree and similar characters
    .replace(/\*/g, '°')                  // NEW RULE: replace asterisk with degree symbol
    .replace(/[º˚]/g, '°')               // odd degree variants
    .replace(/[’‘`‛ʼˈʹʽ′]/g, "'")        // single primes/apostrophes → '
    .replace(/[”“‟˝ˮ″]/g, '"')           // double primes/quotes → "
    .replace(/\s+/g, ' ')                // collapse multiple spaces
    .trim();
}

function splitLatLon(s) {
  const hemiMatch = s.match(/([NS])[^NSEW]*([EW])/i);
  if (hemiMatch) {
    const nsIndex = s.search(/[NS]/i);
    const afterNS = s.slice(nsIndex).search(/[NS]/i) + nsIndex + 1;
    const lat = s.slice(0, afterNS).trim().replace(/[,;]$/, '');
    const lon = s.slice(afterNS).trim();
    return [lat, lon];
  }
  const parts = s.split(/,\s*| {2,}|\s\/\s/).map(x => x.trim()).filter(Boolean);
  if (parts.length === 2) return parts;
  return [s, ''];
}

function formatSingleDMS(coord) {
  if (!coord) return '';
  const c = normalizeSymbols(coord.toUpperCase());
  const re = new RegExp(
    String.raw`^\s*(-?\d{1,3})\s*°?\s*(\d{1,2})\s*['’′]?\s*(\d{1,2}(?:\.\d+)?)\s*["”″]?\s*([NSEW])\s*$`, 'i'
  );
  const m = c.match(re);
  if (m) {
    let [, D, M, S, H] = m;
    const pad2 = v => v.length === 1 ? '0' + v : v;
    const [Sint, Sdec] = S.split('.');
    const Sfixed = (Sint.length === 1 ? '0' + Sint : Sint) + (Sdec ? '.' + Sdec : '');
    return `${parseInt(D,10)}° ${pad2(M)}' ${Sfixed}" ${H.toUpperCase()}`;
  }
  const near = c.match(/(-?\d{1,3})\s+(\d{1,2})\s+(\d{1,2}(?:\.\d+)?)\s*([NSEW])$/i);
  if (near) {
    let [, D, M, S, H] = near;
    const pad2 = v => v.length === 1 ? '0' + v : v;
    const [Sint, Sdec] = S.split('.');
    const Sfixed = (Sint.length === 1 ? '0' + Sint : Sint) + (Sdec ? '.' + Sdec : '');
    return `${parseInt(D,10)}° ${pad2(M)}' ${Sfixed}" ${H.toUpperCase()}`;
  }
  return c;
}

function formatFull(input, withDots) {
  const s = normalizeSymbols(input);
  const [latRaw, lonRaw] = splitLatLon(s);
  const lat = formatSingleDMS(latRaw);
  const lon = formatSingleDMS(lonRaw);
  if (lat && lon) {
    return withDots ? `${lat}  •  ${lon}  •` : `${lat}  ${lon}`;
  }
  if (withDots && lat) return `${lat}  •`;
  return lat || lon || '';
}

// UI
const $in = document.getElementById('in');
const $out = document.getElementById('out');
const $addDots = document.getElementById('addDots');
document.getElementById('fmt').addEventListener('click', () => {
  const withDots = $addDots.checked;
  $out.value = formatFull($in.value, withDots);
});
document.getElementById('copy').addEventListener('click', () => {
  if (!$out.value) return;
  navigator.clipboard.writeText($out.value).catch(()=>{});
});
document.getElementById('clear').addEventListener('click', () => {
  $in.value = '';
  $out.value = '';
});
</script>
</body>
</html>
